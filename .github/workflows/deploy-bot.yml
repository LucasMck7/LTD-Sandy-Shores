name: Deploy Bot → VPS

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy fichiers bot sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          source: "bot/"
          target: "/root/ltd-bot-deploy"
          strip_components: 1

      - name: Redémarrer le bot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            # Copier les fichiers vers le dossier du bot (sans écraser .env)
            rsync -av --exclude='.env' --exclude='node_modules/' /root/ltd-bot-deploy/ /root/ltd-bot/

            cd /root/ltd-bot

            # Installer les dépendances si package.json a changé
            npm install --production

            # Redémarrer avec PM2 si disponible, sinon kill + relance
            if command -v pm2 &> /dev/null; then
              pm2 restart ltd-bot || pm2 start index.js --name ltd-bot
            else
              pkill -f "node index.js" || true
              nohup node index.js > /root/ltd-bot/bot.log 2>&1 &
            fi

            echo "Bot redémarré avec succès"
