/* === ANIMATIONS === */
@keyframes fadeUp    { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn    { from{opacity:0} to{opacity:1} }
@keyframes slideLeft { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideRight{ from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }
@keyframes popIn     { 0%{opacity:0;transform:scale(.92)} 70%{transform:scale(1.03)} 100%{opacity:1;transform:scale(1)} }

.panel:nth-child(3){animation-delay:.08s}
.panel:nth-child(4){animation-delay:.12s}
.panel:nth-child(5){animation-delay:.16s}

.btn-gold,.btn-back-landing,.btn-sm,.nav-btn{transition:transform .15s ease,box-shadow .15s ease,background .15s ease,color .15s ease;}

/* Toast */

#toast-container .toast.hide{animation:slideLeft .25s reverse ease-in forwards;}

/* Input focus glow */
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(200,165,60,.6)!important;box-shadow:0 0 0 3px rgba(200,165,60,.12),0 0 12px rgba(200,165,60,.08);transition:border-color .2s ease,box-shadow .2s ease;}

  initBg(){

    const layers=[
      ['bg-layer bg-gradient',''],
      ['bg-layer bg-grid',''],
      ['bg-layer bg-vignette',''],

      b.insertBefore(d,b.firstChild);

      sc.appendChild(s);

  /* Navigation avec transition fondu */
  goto(url,e){
    if(e)e.preventDefault();
    const pt=document.getElementById('page-transition');
    if(!pt){location.href=url;return;}
    pt.classList.remove('out');
    void pt.offsetWidth;
    pt.classList.add('go');
    setTimeout(()=>location.href=url,380);

  /* Toast */
  toast(title,msg,type='info'){
    let c=document.getElementById('toast-wrap');
    if(!c){c=document.createElement('div');c.id='toast-wrap';document.body.appendChild(c);}
    const d=document.createElement('div');
    d.className=`toast ${type==='success'?'ok':type==='error'?'err':'info'}`;
    d.innerHTML=`<div class="toast-t">${title||''}</div>${msg?`<div class="toast-m">${msg}</div>`:''}`;

    requestAnimationFrame(()=>d.classList.add('show'));
    setTimeout(()=>{d.classList.remove('show');setTimeout(()=>d.remove(),380);},3600);

  sessGet(k){try{const s=sessionStorage.getItem(k);return s?JSON.parse(s):null;}catch{return null;}},

<script>var NOTIFS = {admin:[], partner:[]};


function addNotif(side, title, sub, icon) {
  icon = icon || '📋';
  var n = {id: Date.now(), title: title, sub: sub, icon: icon, read: false, time: new Date()};
  NOTIFS[side].unshift(n);
  if(NOTIFS[side].length > 50) NOTIFS[side].pop();
  refreshNotifBadge(side);
  showToast(title, sub, icon);
}

function refreshNotifBadge(side) {
  var unread = NOTIFS[side].filter(function(n){ return !n.read; }).length;
  var badge = document.getElementById('notif-badge-'+side);
  if(badge) {
    badge.style.display = unread > 0 ? 'flex' : 'none';
    badge.textContent = unread > 9 ? '9+' : String(unread);
  }
}

function toggleNotifPanel(side) {
  var panel = document.getElementById('notif-panel-'+side);
  if(!panel) return;
  var isOpen = panel.classList.contains('open');
  // Close all panels first
  document.querySelectorAll('.notif-panel').forEach(function(p){ p.classList.remove('open'); });
  if(!isOpen) {
    renderNotifPanel(side);
    panel.classList.add('open');
    // Mark all as read
    NOTIFS[side].forEach(function(n){ n.read = true; });
    refreshNotifBadge(side);
  }
}

function renderNotifPanel(side) {
  var panel = document.getElementById('notif-panel-'+side);
  if(!panel) return;
  var items = NOTIFS[side];
  var clearBtn = items.length > 0 ? '<button style="background:none;border:none;color:var(--td);font-size:.65rem;cursor:pointer;letter-spacing:1px" data-action="clear-notifs" data-side="'+side+'">Effacer tout</button>' : '';
  var html = '<div class="notif-header"><span class="notif-header-title">Notifications</span>'+clearBtn+'</div>';
  if(items.length === 0) {
    html += '<div class="notif-empty">Aucune notification</div>';
  } else {
    html += items.map(function(n) {
      var t = n.time instanceof Date ? n.time : new Date(n.time);
      var timeStr = t.getHours()+':'+pad(t.getMinutes());
      return '<div class="notif-item '+(n.read?'':'unread')+'">'
        +'<div class="notif-item-title">'+n.icon+' '+n.title+'</div>'
        +'<div class="notif-item-sub">'+n.sub+' · '+timeStr+'</div>'
        +'</div>';
    }).join('');
  }
  panel.innerHTML = html;
}

function renderOrderSteps(activeId) {
  var bar = document.getElementById('order-steps-bar');

  var activeIdx = -1;
  for(var si=0;si<ORDER_STEPS.length;si++){ if(ORDER_STEPS[si].id===activeId){ activeIdx=si; break; } }

  bar.style.display = 'block';
  var html = '<div class="order-steps">';
  ORDER_STEPS.forEach(function(step, i) {
    var isDone = i < activeIdx;
    var isActive = i === activeIdx;
    var circleClass = isDone ? 'done' : isActive ? 'active' : '';
    var labelClass = isActive ? 'active' : '';
    html += '<div class="step-item">'
      +'<div class="step-circle '+circleClass+'">'+(isDone ? '=' : step.icon)+'</div>'
      +'<div class="step-label '+labelClass+'">'+step.label+'</div>'
      +'</div>';
    if(i < ORDER_STEPS.length - 1) {
      html += '<div class="step-line '+(isDone?'done':'')+'" style="margin-bottom:1.2rem"></div>';
    }
  });
  html += '</div>';
  bar.innerHTML = html;
}

function showSuccessAnimation(oid) {
  var overlay = document.getElementById('success-overlay');
  var ref = document.getElementById('success-ref');
  var bar = document.getElementById('success-bar-fill');
  if(!overlay) return;

  // Reset bar animation
  if(bar) { bar.style.animation = 'none'; bar.offsetHeight; bar.style.animation = ''; }

  if(ref) ref.textContent = oid;
  overlay.classList.add('show');

  // After 3.8s, fade out and go back to catalog
  setTimeout(function() {
    overlay.style.transition = 'opacity .5s ease';
    overlay.style.opacity = '0';
    setTimeout(function() {
      overlay.classList.remove('show');
      overlay.style.transition = '';
      overlay.style.opacity = '';
      // Reset nav + go to catalog
      document.querySelectorAll('#app-partner .nav-btn').forEach(function(b){ b.classList.remove('active'); });
      var cat = document.getElementById('pnav-catalog');
      if(cat) cat.classList.add('active');
      renderCatalog();
      showPartnerSection('catalog');
    }, 500);
  }, 3800);
}

function getEntrepriseRolePing(companyName) {

    if(!r) return '';

    if(r.startsWith('<@&')) return r;
    return '<@&'+r.replace(/[^0-9]/g,'')+'>';
  }
  for(var ci=0; ci<S.companies.length; ci++) {
    if(S.companies[ci].name===companyName && S.companies[ci].rolePing) return fmtRole(S.companies[ci].rolePing);
  }
  var cd = COMPANY_DISCORD[companyName];
  return (cd && cd.rolePing) ? fmtRole(cd.rolePing) : '';
}

function discordRequest(method, url, payload, callback) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open(method, url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    if(callback) xhr.onload = function() {
      if(xhr.status >= 200 && xhr.status < 300) {
        try { callback(JSON.parse(xhr.responseText)); } catch(e) {}
      }
    };
    xhr.send(JSON.stringify(payload));
  } catch(e) { console.warn('Discord error:', e); }
}

function buildOrderEmbed(order, color) {
  var co = null;
  for(var ci=0; ci<S.companies.length; ci++) {
    if(S.companies[ci].name===order.company) { co=S.companies[ci]; break; }
  }
  var stMap = {
    new:      {icon:'🟡', label:'Nouvelle',       col:0xF0C040},
    progress: {icon:'🛠️',  label:'En préparation', col:0x4A90D9},
    done:     {icon:'📦', label:'Prête',           col:0x5DB85D},
    livree:   {icon:'🚚', label:'Livrée',          col:0x27AE60},
    annule:   {icon:'=', label:'Annulée',         col:0xE74C3C},
  };
  var st = stMap[order.status] || {icon:'=', label:order.status, col:0x888888};
  var embedColor = color !== undefined ? color : st.col;

  // French date with day name
  var JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  var MOIS  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','decembre'];
  var fmtDate = function(dateStr) {
    if(!dateStr) return '—';
    var parts = dateStr.split('-');
    if(parts.length !== 3) return dateStr;
    var d = new Date(+parts[0], +parts[1]-1, +parts[2]);
    return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]+' '+parts[0];
  };

  // Products list
  var productList = '';
  var grandTotal = 0;
  for(var ii=0; ii<order.items.length; ii++) {
    var it=order.items[ii], p=getP(it.pid);
    var pr=co?getPrice(it.pid,co):(p?p.price:0);
    if(p) {
      var sub=pr*it.qty; grandTotal+=sub;
      productList += p.emoji+' **'+p.name+'** — '+it.qty+' '+p.unit+' x '+fmtP(pr)+' = **'+fmtP(sub)+'**\n';
    }
  }
  if(!productList) productList='—';

  var disc = order.discount ? fmtP(grandTotal*(1-order.discount/100))+' *(remise '+order.discount+'%)*' : '**'+fmtP(grandTotal)+'**';
  var payStr = order.payMethod==='iban'
    ? ('\uD83C\uDFE6 Virement IBAN'+(order.iban?' - '+order.iban:''))
    : '💵 Paiement à la livraison';

  var fields = [
    {name:'👤 Contact',   value:order.contact||'—', inline:true},
    {name:'📞 Telephone', value:order.phone||'—',   inline:true},
    {name:'📦 Commande',  value:productList,         inline:false},
    {name:'💰 Total',     value:disc,                inline:true},
    {name:'💳 Paiement',  value:payStr,              inline:true},
    {name:'📅 Livraison', value:fmtDate(order.deliveryDate)+' — '+order.slot, inline:true},
    {name:'📋 Statut',    value:st.icon+' **'+st.label+'**',                  inline:true},
  ];
  if(order.livreurName) fields.push({name:'🚚 Livreur', value:'**'+order.livreurName+'**', inline:true});
  if(order.notes)       fields.push({name:'📝 Note',    value:'> '+order.notes,            inline:false});

  return {
    title:'🛒 '+order.id+' — '+order.company,
    color:embedColor,
    fields:fields,
    footer:{text:'LTD Sandy Shores • Espace Entreprise'},
    timestamp:new Date().toISOString(),
  };
}

  var descMap = {

    done:     'Votre commande a été livrée avec succès. Merci pour votre confiance !',

    { name: '🧾 Reference',  value: '**'+order.id+'**',       inline: true },

  if(order.deliveryDate)
    fields.push({ name: '📅 Livraison prévue', value: order.deliveryDate+' — '+(order.slot||''), inline: true });

function _pushToGAS(json, immediate) {
  if(typeof google === 'undefined' || !google.script || !google.script.run) return;
  setSaveIndicator('saving');
  var doSend = function() {
    ltdFetch('ent_save_data',JSON.parse(json),true)
      .then(function(){setSaveIndicator('ok');_syncFromPHP(null);})
      .catch(function(e){setSaveIndicator('error');console.warn('save error:',e);});
  };
  if(immediate) {
    if(_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
    doSend();
  } else {
    if(_saveTimer) clearTimeout(_saveTimer);
    _saveTimer = setTimeout(doSend, 800);
  }
}

  try {
    if(typeof __INITIAL_DATA__ !== 'undefined' && __INITIAL_DATA__) {
      var data = __INITIAL_DATA__;
      applyStateData(data);
      // Sync localStorage avec les donnees serveur
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
      return;
    }
  } catch(e) { console.warn('GAS inject load error:', e); }
  // 2. Fallback localStorage
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) { applyStateData(JSON.parse(raw)); }
  } catch(e) { console.warn('loadState error:', e); }
}

// === TIME SLOTS ===
function buildSlots(selected, minSlot) {
  var out = '<option value="">— Choisir —</option>';
  for(var hh=0;hh<24;hh++) {
    for(var mm=0;mm<60;mm+=30) {
      var hh2 = mm===30 ? hh : hh+1;
      var mm2 = mm===30 ? 0  : 30;
      if(hh2>=24) continue;
      var s = pad(hh)+':'+pad(mm)+'-'+pad(hh2)+':'+pad(mm2);
      var disabled = minSlot && s < minSlot ? 'disabled' : '';
      out += '<option value="'+s+'" '+(selected===s?'selected':'')+' '+disabled+'>'+s+'</option>';
    }
  }
  return out;
}
function pad(n){ return n<10?'0'+n:String(n); }

function buildHourOptions(selected) {
  var out = '<option value="">— Heure —</option>';
  for(var hh=0; hh<24; hh++) {
    ['00','30'].forEach(function(mm){
      var val = pad(hh)+':'+mm;
      out += '<option value="'+val+'"'+(selected===val?' selected':'')+'>'+val+'</option>';
    });
  }
  return out;
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function nowSlot() {
  var now = new Date();
  return pad(now.getHours())+':'+pad(now.getMinutes()<30?0:30);
}

function minSlotForDate(dateStr) {
  if(dateStr === todayStr()) {
    // Return current half-hour slot start
    var now = new Date();
    var hh = now.getHours();
    var mm = now.getMinutes() < 30 ? 30 : 60; // next slot
    if(mm === 60) { hh++; mm = 0; }
    if(hh >= 24) return '24:00'; // all slots disabled
    return pad(hh)+':'+pad(mm)+'-';
  }
  return null;
}

    var vb = field==='total' ? b.total*(1-((b.discount||0)/100)) : b.date;

        +(o.status==='progress' ? '<button class="btn-sm btn-sm-gold" data-action="order-status" data-id="'+o.id+'" data-status="done">= Livrée</button> ' : '')

        +'<td><div style="color:var(--orb)">'+o.deliveryDate+'</div><div class="text-xs text-muted">'+o.slot+'</div></td>'

        +'<td>'+priceHtml+'</td>'
        +'<td style="display:flex;gap:.4rem;flex-wrap:wrap;padding:.5rem .8rem">'+actHtml+'</td>'

  el.innerHTML = '<div class="page-header"><div class="page-title">Commandes</div><div class="page-sub">Gestion des commandes partenaires</div><div class="gold-line"></div></div>'

    +'<div class="tabs" style="margin-bottom:0">'+tabsHtml+'</div>'+sortHtml+'</div>'
    +'<div style="margin-bottom:.75rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">'+(function(){
      var _ns=[];

      _ns.sort();
      return '<select id="order-co-filter" onchange="S.orderCompanyFilter=this.value;renderOrders();" style="background:rgba(0,0,0,.5);border:1px solid rgba(160,120,32,.3);color:var(--cr);font-family:\'Oswald\',sans-serif;font-size:.8rem;padding:.3rem .6rem;border-radius:3px;outline:none;min-width:160px">'
        +'<option value="">Toutes les entreprises</option>'
        +_ns.map(function(n){return '<option value="'+n+'"'+(S.orderCompanyFilter===n?' selected':'')+'>'+n+'</option>';}).join('')

}

// === RENDER LIVREURS ===
function renderLivreurs() {
  var cards = S.livreurs.map(function(l) {
    var cnt = S.orders.filter(function(o){ return o.livreurId===l.id; }).length;
    return '<div class="panel" style="padding:1.2rem">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem">'
      +'<div><div style="font-family:\'Rye\',serif;color:var(--orb);font-size:1rem">🚚 '+l.name+'</div>'
      +'<div class="text-xs text-muted" style="margin-top:.2rem">'+l.phone+'</div></div>'
      +'<span class="badge '+(l.active?'badge-done':'badge-new')+'">'+(l.active?'Actif':'Inactif')+'</span></div>'
      +'<div class="text-xs text-muted" style="margin-bottom:.75rem">Commandes assignées: <strong style="color:var(--orc)">'+cnt+'</strong></div>'
      +'<div style="display:flex;gap:.4rem;flex-wrap:wrap">'
      +'<button class="btn-sm" data-action="edit-livreur" data-id="'+l.id+'">Modifier</button>'
      +'<button class="btn-sm '+(l.active?'btn-sm-danger':'')+'" data-action="toggle-livreur" data-id="'+l.id+'">'+(l.active?'Désactiver':'Activer')+'</button>'
      +'<button class="btn-sm btn-sm-danger" data-action="del-livreur" data-id="'+l.id+'">🗑</button>'
      +'</div></div>';
  }).join('');

  var assigned = S.livreurs.map(function(l) {
    var cmds = S.orders.filter(function(o){ return o.livreurId===l.id; });
    if(!cmds.length) return '';
    var rows = cmds.map(function(o) {
      var disc = o.discount ? o.total*(1-o.discount/100) : o.total;
      var sc = o.status==='new'?'badge-new':o.status==='progress'?'badge-progress':'badge-done';
      var sl = o.status==='new'?'Nouvelle':o.status==='progress'?'En cours':'Livrée';
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem .6rem;background:rgba(14,8,5,.4);border-radius:4px;margin-bottom:.3rem;flex-wrap:wrap;gap:.3rem">'
        +'<span class="text-gold" style="font-size:.85rem">'+o.id+'</span>'
        +'<span style="font-size:.8rem">'+o.company+'</span>'
        +'<span class="text-xs text-muted">'+o.deliveryDate+' '+o.slot+'</span>'
        +'<span class="badge '+sc+'">'+sl+'</span>'
        +'<span class="text-gold" style="font-size:.85rem;font-family:\'Rye\',serif">'+fmtP(disc)+'</span></div>';
    }).join('');
    return '<div style="margin-bottom:1.25rem"><div style="font-size:.8rem;font-weight:600;color:var(--orc);letter-spacing:1px;margin-bottom:.5rem">🚚 '+l.name+'</div>'+rows+'</div>';
  }).join('');
  if(!assigned) assigned = '<div class="text-muted text-xs" style="text-align:center;padding:1rem">Aucune commande assignée</div>';

  document.getElementById('admin-livreurs').innerHTML =
    '<div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem">'
    +'<div><div class="page-title">Livreurs</div><div class="page-sub">Gestion des livreurs</div><div class="gold-line"></div></div>'
    +'<button class="btn-gold" style="width:auto;padding:.6rem 1.5rem;margin-top:1.5rem" data-action="add-livreur">+ Nouveau livreur</button></div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:2rem">'+cards+'</div>'
    +'<div class="panel"><div class="panel-title">Commandes assignées</div>'+assigned+'</div>';
}

function saveOrder() {
  var o = S.editTarget;
  if(!o) return;

  // Snapshot avant modif pour detecter les changements
  var prev = {
    contact: o.contact, phone: o.phone,
    deliveryDate: o.deliveryDate, slot: o.slot,
    status: o.status, notes: o.notes,
    discount: o.discount||0,
    livreurName: o.livreurName||null,
  };

  o.contact      = document.getElementById('eo-contact').value.trim();
  o.phone        = document.getElementById('eo-phone').value.trim();
  o.deliveryDate = document.getElementById('eo-date').value;
  o.slot         = document.getElementById('eo-slot').value;
  o.status       = document.getElementById('eo-status').value;
  o.notes        = document.getElementById('eo-notes').value.trim();
  o.discount     = Math.min(100,Math.max(0,parseInt(document.getElementById('eo-discount').value)||0));
  var livId      = parseInt(document.getElementById('eo-livreur').value)||null;
  o.livreurId    = livId;
  var lv         = livId ? S.livreurs.find(function(l){ return l.id===livId; }) : null;
  o.livreurName  = lv ? lv.name : null;

  if(S.userType === 'admin') {
    // Construire la liste des changements
    var stLbl = {new:'Nouvelle',progress:'En cours',done:'Livree',annule:'Annulee',ready:'Prete'};
    var changes = [];
    if(prev.status !== o.status)
      changes.push('📋 Statut : **'+( stLbl[prev.status]||prev.status)+' → '+(stLbl[o.status]||o.status)+'**');
    if(prev.contact !== o.contact)
      changes.push('👤 Contact : '+prev.contact+' → **'+o.contact+'**');
    if(prev.phone !== o.phone)
      changes.push('📞 Téléphone : '+prev.phone+' → **'+o.phone+'**');
    if(prev.deliveryDate !== o.deliveryDate || prev.slot !== o.slot)
      changes.push('📅 Livraison : '+prev.deliveryDate+' '+prev.slot+' → **'+o.deliveryDate+' '+o.slot+'**');
    if((prev.discount||0) !== (o.discount||0)) {
      if(o.discount > 0)
        changes.push('💸 Remise appliquee : **'+o.discount+'%** — Prix initial : '+fmtP(o.total)+' → Prix remise : **'+fmtP(o.total*(1-o.discount/100))+'**');
      else
        changes.push('💸 Remise supprimee — Prix retabli : **'+fmtP(o.total)+'**');
    }
    var livreurChanged = (prev.livreurName||'') !== (o.livreurName||'');
    if(livreurChanged && o.livreurName)
      {} // Traite separement ci-dessous
    else if(livreurChanged && !o.livreurName)
      changes.push('🚚 Livreur retire');
    if(prev.notes !== o.notes)
      changes.push('📝 Note mise a jour');

    var changesTxt = changes.length ? changes.join('\n') : 'Aucune modification detectee';

    addNotif('admin', 'Commande modifiee — '+o.id, changesTxt, '✏️');
    addNotif('partner', 'Votre commande '+o.id+' a ete mise a jour', changesTxt, '🔔');
    discordOrderEdit(o, changesTxt);
    // Message livreur special
    if(livreurChanged && o.livreurName) {
      discordNotifyEntrepriseLivreur(o);
    }
    if(o.status !== prev.status) discordNotifyEntreprise(o, o.status, changesTxt);
    else if(changes.length) discordNotifyEntreprise(o, 'edit', changesTxt);
  }
  closeModal(); saveNow(); renderOrders();
}

function updateCartBar() {
  var cnt = cartCount(), total = cartTotal();

  if(footer) {
    footer.style.display = cnt > 0 ? 'flex' : 'none';
    var ft = document.getElementById('catalog-footer-total');
    var fc = document.getElementById('catalog-footer-count');
    if(ft) ft.textContent = fmtP(total);
    if(fc) fc.textContent = cnt+' article(s)';
  }
  // Mettre à jour les badges qty et la classe selected sur les cartes pc2
  if(S.user && S.user.catalog) {
    (S.user.catalog||[]).forEach(function(pid){
      var card = document.getElementById('pcard-'+pid);
      if(!card) return;
      var qty = S.cart[pid]||0;
      card.classList.toggle('pc2-sel', qty>0);
      // Mettre à jour badge
      var top = card.querySelector('.pc2-top');
      if(top){
        var existing = top.querySelector('.pc2-qty-badge');
        if(qty>0){
          if(existing) existing.textContent='×'+qty;
          else { var b=document.createElement('span'); b.className='pc2-qty-badge'; b.textContent='×'+qty; top.appendChild(b); }
        } else {
          if(existing) existing.remove();
        }
      }
    });
  }
}

function renderHistory() {
  var hfield = S.histSort.field, hdir = S.histSort.dir;
  var myOrders = S.orders.filter(function(o){ return o.company===S.user.name; });
  var sorted = myOrders.slice().sort(function(a,b) {
    var va = hfield==='total' ? a.total*(1-((a.discount||0)/100)) : a.date;
    var vb = hfield==='total' ? b.total*(1-((b.discount||0)/100)) : b.date;
    if(typeof va==='string') return hdir==='asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return hdir==='asc' ? va-vb : vb-va;
  });
  var statusBadge = function(s){ return s==='new'?'badge-new':s==='progress'?'badge-progress':'badge-done'; };
  var statusLabel = function(s){ return {new:'Nouvelle',progress:'En cours',done:'Livrée'}[s]||s; };

  var sortHtml = '<div style="display:flex;gap:.4rem;align-items:center">'
    +'<span class="text-xs text-muted">Trier:</span>'
    +'<button class="btn-sm '+(hfield==='date'?'btn-sm-gold':'')+'" data-action="sort-history" data-field="date">Date '+(hfield==='date'?(hdir==='asc'?'↑':'↓'):'')+' </button>'
    +'<button class="btn-sm '+(hfield==='total'?'btn-sm-gold':'')+'" data-action="sort-history" data-field="total">Prix '+(hfield==='total'?(hdir==='asc'?'↑':'↓'):'')+' </button>'
    +'</div>';

  var cards = sorted.length===0
    ? '<div class="panel"><div class="text-muted" style="text-align:center;padding:2rem">Aucune commande enregistrée</div></div>'
    : sorted.map(function(o) {
        var discounted = o.discount ? o.total*(1-o.discount/100) : o.total;
        var parts = o.items.map(function(i){ var p=getP(i.pid); return p?p.emoji+' '+p.name+' × '+i.qty+' '+p.unit:''; }).join(' · ');
        return '<div class="panel" style="margin-bottom:1rem;padding:1.2rem">'
          +'<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem">'
          +'<div><div style="font-family:\'Rye\',serif;color:var(--orb);font-size:1rem">'+o.id+'</div>'
          +'<div class="text-xs text-muted" style="margin-top:.2rem">'+o.date+' · '+o.deliveryDate+' '+o.slot+'</div></div>'
          +'<div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">'
          +'<span class="badge '+statusBadge(o.status)+'">'+statusLabel(o.status)+'</span>'
          +(o.livreurName?'<span class="badge badge-progress">🚚 '+o.livreurName+'</span>':'')
          +'</div></div>'
          +'<div style="font-size:.8rem;color:var(--cr);margin-bottom:.75rem">'+parts+'</div>'
          +'<div style="display:flex;justify-content:flex-end;align-items:center;gap:.75rem;border-top:1px solid rgba(160,120,32,0.15);padding-top:.6rem">'
          +(o.discount?'<span class="text-xs text-muted" style="text-decoration:line-through">'+fmtP(o.total)+'</span><span class="badge badge-done">-'+o.discount+'%</span>':'')
          +'<span style="font-family:\'Rye\',serif;font-size:1.1rem;color:var(--orb)">'+fmtP(discounted)+'</span>'
          +'<div style="display:flex;gap:.5rem;margin-left:auto">'
          +'<button class="btn-sm" data-action="hist-view" data-id="'+o.id+'">👁</button>'
          +'<button class="btn-sm" style="background:rgba(160,120,32,.12);border-color:rgba(160,120,32,.3);color:var(--orb)" data-action="hist-fav" data-id="'+o.id+'">⭐</button>'
          +(o.status==='new'?'<button class="btn-sm" style="background:rgba(160,120,32,.15);border-color:rgba(160,120,32,.4);color:var(--orb)" data-action="hist-edit" data-id="'+o.id+'">=️ Modifier</button><button class="btn-sm" style="background:rgba(180,40,40,.12);border-color:rgba(180,40,40,.3);color:#e05555" data-action="hist-del" data-id="'+o.id+'">🗑 Annuler</button>':'')
          +'</div>'
          +'</div></div>';
      }).join('');

  document.getElementById('partner-history').innerHTML =
    '<div class="page-header"><div class="page-title">Historique</div><div class="page-sub">Toutes vos commandes</div><div class="gold-line"></div></div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;margin-bottom:1.5rem">'
    +'<div class="text-muted text-xs">'+myOrders.length+' commande(s) au total</div>'+sortHtml+'</div>'
    +cards;
}


// === MODAL PRODUCT ===
function saveProduct() {
  var name  = (document.getElementById('mp-name')||{}).value||'';
  var price = parseFloat((document.getElementById('mp-price')||{}).value||'0')||0;
  var unit  = (document.getElementById('mp-unit')||{}).value||'Unité';
  var emoji = (document.getElementById('mp-emoji')||{}).value||'📦';
  if(!name) { showToast('Nom requis'); return; }
  if(S.editTarget) {
    S.editTarget.name=name; S.editTarget.price=price; S.editTarget.unit=unit; S.editTarget.emoji=emoji;
  } else {
    S.products.push({id:S.nextProdId++, name:name, price:price, unit:unit, emoji:emoji});
  }
  closeModal(); saveNow(); renderProducts(); showToast('Produit enregistré');
}

// === EVENT DELEGATION ===
document.addEventListener('click', function(e) {
  var btn = e.target.closest('[data-action]');
  if(!btn) {
    if(e.target.id==='modal-overlay') closeModal();
    // Close notif panels on outside click
    if(!e.target.closest('.notif-wrap')) {
      document.querySelectorAll('.notif-panel').forEach(function(p){ p.classList.remove('open'); });
    }
    return;
  }
  var a = btn.getAttribute('data-action');

  if(a==='set-order-tab') { S.orderTab=btn.getAttribute('data-tab'); renderOrders(); return; }
  if(a==='sort-admin') { setSortAdmin(btn.getAttribute('data-field')); return; }
  if(a==='view-order') { modalViewOrder(btn.getAttribute('data-id')); return; }
  if(a==='edit-order') { modalEditOrder(btn.getAttribute('data-id')); return; }
  if(a==='save-order') { saveOrder(); return; }
  if(a==='edit-order-qty') { modalEditOrderQty(btn.getAttribute('data-id')); return; }
  if(a==='edit-order-info') { modalEditOrderInfo(btn.getAttribute('data-id')); return; }
  if(a==='save-order-qty') { saveOrderQty(btn.getAttribute('data-id')); return; }
  if(a==='eq-minus'){var _eq=parseInt(btn.getAttribute('data-pid'));var _eqi=document.getElementById('eq-qty-'+_eq);if(_eqi)_eqi.value=Math.max(0,(parseInt(_eqi.value)||0)-1);return;}
  if(a==='eq-plus'){var _eq2=parseInt(btn.getAttribute('data-pid'));var _eqi2=document.getElementById('eq-qty-'+_eq2);if(_eqi2)_eqi2.value=(parseInt(_eqi2.value)||0)+1;return;}
  if(a==='del-order') {
    if(!confirm('Supprimer cette commande ?')) return;
    var _doid=btn.getAttribute('data-id');
    var _dord=S.orders.find(function(o){return o.id===_doid;});
    S.orders=S.orders.filter(function(o){ return o.id!==_doid; });
    if(_dord) { discordOrderDeleted(_dord); addActivityLog('Commande supprimee : '+_doid+' ('+(_dord.company||'')+')'); }
    saveNow(); renderOrders(); return;
  }
  if(a==='order-status') {
    var ord=S.orders.find(function(o){ return o.id===btn.getAttribute('data-id'); });
    if(ord){
      var oldStatus = ord.status;
      ord.status=btn.getAttribute('data-status'); saveNow();
      discordStatusChange(ord);
      discordNotifyEntreprise(ord, ord.status);
      if(ord.status==='livree') discordFinalDelivery(ord);
      var stLbl = {new:'Nouvelle',progress:'En cours',done:'Livrée',livree:'Livrée OK',annule:'Annulée'}[ord.status]||ord.status;
      addNotif('admin','Statut: '+stLbl+' — '+ord.id,ord.company,'[stat]');
      addNotif('partner','Votre commande '+ord.id+' est maintenant: '+stLbl,'Mise à jour par LTD Sandy Shores','[notif]');
      addActivityLog('Statut '+ord.id+' -> '+stLbl+' ('+ord.company+')');
      renderOrders();
    }
    return;
  }

  if(a==='add-product') { modalProduct(null); return; }
  if(a==='edit-product') { modalProduct(parseInt(btn.getAttribute('data-id'))); return; }
  if(a==='save-product') { saveProduct(); return; }
  if(a==='del-product') { if(!confirm('Supprimer ce produit ?')) return; var _delId=String(btn.getAttribute('data-id')); S.products=S.products.filter(function(p){ return String(p.id)!==_delId; }); S.companies.forEach(function(c){ c.catalog=c.catalog.filter(function(id){ return String(id)!==_delId; }); }); saveState(); renderProducts(); return; }

  if(a==='add-company') { modalCompany(null); return; }
  if(a==='edit-company') { modalCompany(parseInt(btn.getAttribute('data-id'))); return; }
  if(a==='save-company') { saveCompany(); return; }
  if(a==='save-discord') { saveDiscord(); return; }
  if(a==='del-company') { if(!confirm('Supprimer cette entreprise ?')) return; S.companies=S.companies.filter(function(c){ return c.id!==parseInt(btn.getAttribute('data-id')); }); saveState(); renderCompanies(); return; }
  if(a==='manage-catalog') { modalCatalog(parseInt(btn.getAttribute('data-id'))); return; }
  if(a==='save-catalog') { S.editTarget.catalog=S.products.filter(function(p){ var cb=document.getElementById('cat-'+p.id); return cb&&cb.checked; }).map(function(p){ return p.id; });
    if(!S.editTarget.prices) S.editTarget.prices = {};
    S.products.forEach(function(p) {
      var inp = document.getElementById('price-'+p.id);
      if(inp && inp.value !== '') {
        var v = parseFloat(inp.value);
        if(!isNaN(v) && v > 0) S.editTarget.prices[p.id] = v;
        else delete S.editTarget.prices[p.id];
      } else {
        delete S.editTarget.prices[p.id];
      }
    });
    closeModal(); saveNow(); renderCompanies(); return; }

  if(a==='add-livreur') { modalLivreur(null); return; }
  if(a==='edit-livreur') { modalLivreur(parseInt(btn.getAttribute('data-id'))); return; }
  if(a==='save-livreur') { saveLivreur(); return; }
  if(a==='toggle-livreur') { var lv=S.livreurs.find(function(l){ return l.id===parseInt(btn.getAttribute('data-id')); }); if(lv){ lv.active=!lv.active; saveState(); renderLivreurs(); } return; }
  if(a==='del-livreur') { if(!confirm('Supprimer ce livreur ?')) return; var did=parseInt(btn.getAttribute('data-id')); S.livreurs=S.livreurs.filter(function(l){ return l.id!==did; }); S.orders.forEach(function(o){ if(o.livreurId===did){ o.livreurId=null; o.livreurName=null; } }); saveState(); renderLivreurs(); return; }

  if(a==='preview-catalog') { S.catalogPreview=parseInt(btn.getAttribute('data-id')); renderCatalogues(); return; }
  if(a==='close-modal') { closeModal(); return; }

  if(a==='qty-plus') { var pid=String(btn.getAttribute('data-pid')); S.cart[pid]=(S.cart[pid]||0)+1; var el=document.getElementById('qty-'+pid); if(el) el.value=S.cart[pid]; updateCartBar(); return; }
  if(a==='qty-minus') { var pid2=String(btn.getAttribute('data-pid')); if(S.cart[pid2]>0){ S.cart[pid2]--; if(!S.cart[pid2]) delete S.cart[pid2]; } var el2=document.getElementById('qty-'+pid2); if(el2) el2.value=S.cart[pid2]||0; updateCartBar(); return; }

  if(a==='date-changed') {
    var dtEl = document.getElementById('ff-dt');
    var slEl = document.getElementById('ff-sl');
    if(dtEl && slEl) {
      var min = minSlotForDate(dtEl.value);
      slEl.innerHTML = buildSlots('', min);
    }
    return;
  }
  if(a==='go-recap') {
    var f=S.orderForm;
    f.firstname=document.getElementById('ff-fn')?document.getElementById('ff-fn').value.trim():'';
    f.lastname=document.getElementById('ff-ln')?document.getElementById('ff-ln').value.trim():'';
    f.phone=document.getElementById('ff-ph')?document.getElementById('ff-ph').value.trim():'';
    f.date=document.getElementById('ff-dt')?document.getElementById('ff-dt').value:'';
    var _ffFrom = document.getElementById('ff-sl-from');
    var _ffTo   = document.getElementById('ff-sl-to');
    f.slot = (_ffFrom && _ffTo && _ffFrom.value && _ffTo.value) ? _ffFrom.value+'-'+_ffTo.value : (f.slot||'');
    f.notes=document.getElementById('ff-nt')?document.getElementById('ff-nt').value.trim():'';
    var _payR = document.querySelector('input[name="ff-pay"]:checked');
    f.payMethod = _payR ? _payR.value : 'delivery';
    f.iban = (f.payMethod === 'iban' && document.getElementById('ff-iban')) ? document.getElementById('ff-iban').value.trim() : '';
    if(!f.firstname||!f.lastname||!f.phone||!f.date||!f.slot){ var err=document.getElementById('form-err'); if(err) err.classList.add('show'); return; }
    renderRecap(); showPartnerSection('recap'); return;
  }
  if(a==='go-form') { renderForm(); showPartnerSection('form'); return; }
  if(a==='go-catalog') { renderCatalog(); showPartnerSection('catalog'); updateCartBar(); return; }
  if(a==='save-profile') {
    var _fn = document.getElementById('ff-fn'), _ln = document.getElementById('ff-ln'), _ph = document.getElementById('ff-ph');
    var _pfn = _fn?_fn.value.trim():'', _pln = _ln?_ln.value.trim():'', _pph = _ph?_ph.value.trim():'';
    if(!_pfn || !_pln) { showToast('Remplissez prénom et nom d abord.', '', '=️'); return; }
    if(!S.user.contacts) S.user.contacts = [];
    // Check duplicate
    var _dup = false;
    for(var _dci=0; _dci<S.user.contacts.length; _dci++) {
      if(S.user.contacts[_dci].firstname===_pfn && S.user.contacts[_dci].lastname===_pln) { _dup=true; break; }
    }
    if(_dup) { showToast('Ce contact existe déjà.', '', '=️'); return; }
    S.user.contacts.push({firstname:_pfn, lastname:_pln, phone:_pph});
    saveState();
    showToast('Contact enregistré !', _pfn+' '+_pln, '=');
    renderForm();
    return;
  }

function checkAutoOpenOrder() {
  try {
    var search = window.location.search || '';
    if(!search) return;
    var match = search.match(/[?&]order=([^&]+)/);
    if(!match) return;
    var oid = decodeURIComponent(match[1]);
    // Only works if already logged in as admin
    if(S.userType !== 'admin') return;
    // Find the order and highlight it
    var ord = null;
    for(var i=0; i<S.orders.length; i++) {
      if(S.orders[i].id === oid) { ord = S.orders[i]; break; }
    }
    if(!ord) { showToast('Commande introuvable : '+oid, '', '❌'); return; }
    showAdminSection('orders');
    setTimeout(function() {
      var el = document.getElementById('order-row-'+oid);
      if(el) {
        el.scrollIntoView({behavior:'smooth', block:'center'});
        el.style.transition = 'background .3s';
        el.style.background = 'rgba(200,165,60,.25)';
        setTimeout(function(){ el.style.background=''; }, 2500);
      }
    }, 300);
    showToast('Commande ouverte', oid, '🛒');
  } catch(e) {}
}

// ============================================================
// POLLING TEMPS REEL (toutes les 10 secondes)
// ============================================================
function startPolling() {
  if(S._pollingActive) return;
  S._pollingActive=true;
  _doPoll();
}
function stopPolling() {
  S._pollingActive=false;
  if(S._pollingTimer){ clearTimeout(S._pollingTimer); S._pollingTimer=null; }
}
function _doPoll() {
  if(!S._pollingActive) return;
  _syncFromGAS(function(){ S._pollingTimer=setTimeout(_doPoll,5000); });
}
function _syncFromGAS(cb){ _syncFromPHP(cb); }
function _syncFromPHP(cb) {
  Promise.all([
    ltdFetch('ent_get_data').catch(function(){ return null; }),
    ltdFetch('get_products_entreprise').catch(function(){ return null; }),
    ltdFetch('get_companies').catch(function(){ return null; })
  ]).then(function(results) {
    try {
      var res = results[0], prodRes = results[1], coRes = results[2];
      if(res && res.data) applyStateData(res.data);
      if(prodRes && prodRes.success && prodRes.products && prodRes.products.length) {
        S.products = prodRes.products.map(function(p){
          return {id:p.id, name:p.name||p.nom||'', price:parseFloat(p.price||p.prix)||0,
            unit:p.unit||p.unite||'Unite', emoji:p.emoji||'📦', rupture:!!p.rupture};
        });
      }
      if(coRes && coRes.success && coRes.companies && coRes.companies.length) {
        S.companies = mergeCompanyDefaults(coRes.companies);
      }
      var _modalOpen = document.getElementById('modal-overlay') && document.getElementById('modal-overlay').classList.contains('open');
      if(_modalOpen) { if(cb)cb(); return; }
      var sec=S.adminSection||'';
      if(sec==='orders')    renderOrders();
      if(sec==='dashboard') renderDashboard();
      if(sec==='companies') renderCompanies();
      if(sec==='products')  renderProducts();
      if(sec==='livreurs')  renderLivreurs();
      var psec=S.partnerSection||'';
      if(psec==='catalog')  { renderCatalog(); updateCartBar(); }
      if(psec==='history')  renderHistory();
      // Ne PAS appeler renderForm() depuis le polling — cela réinitialise les champs en cours de saisie
      // if(psec==='form')     renderForm();
      if(psec==='profil')   renderPartnerProfil();
    } catch(e){ console.warn('_syncFromPHP error:',e); }
    if(cb)cb();
  }).catch(function(){ if(cb)cb(); });
}
function forceSyncNow() {
  showToast('Synchronisation en cours...');
  _syncFromGAS(function(){ showToast('Donnees a jour'); });
}

// MESSAGE FINAL LIVRAISON
// ============================================================
function discordFinalDelivery(order) {
  var wh=getEntrepriseWebhook(order.company);
  var rp=getEntrepriseRolePing(order.company);
  if(!wh) return;
  var co=S.companies.find(function(c){ return c.name===order.company; });
  var productLines='';
  (order.items||[]).forEach(function(it){
    var p=getP(it.pid); if(!p) return;
    var pr=co?getPrice(it.pid,co):p.price;
    productLines+=p.emoji+' **'+p.name+'** — '+it.qty+' '+p.unit+' × '+fmtP(pr)+' = **'+fmtP(pr*it.qty)+'**\n';
  });
  var total=order.discount?order.total*(1-order.discount/100):order.total;
  var fields=[
    {name:'Total regle',value:'**'+fmtP(total)+'**',inline:true},
    {name:'Livreur',value:order.livreurName||'—',inline:true},
    {name:'Date livraison',value:order.deliveryDate+' — '+order.slot,inline:false}
  ];
  if(order.invoiceNum) fields.push({name:'N Facture',value:'**'+order.invoiceNum+'**',inline:true});
  var embed={
    title:'Commande livree — '+order.id,
    description:'Votre commande a ete livree avec succes !\n\n'+productLines,
    color:0x27AE60,
    fields:fields,
    footer:{text:'LTD Sandy Shores — Espace Entreprise'},
    timestamp:new Date().toISOString()
  };
  var xhr2=new XMLHttpRequest();
  xhr2.open('POST',wh,true);
  xhr2.setRequestHeader('Content-Type','application/json');
  xhr2.send(JSON.stringify({content:(rp?rp+' ':'')+'Votre livraison est arrivee !',embeds:[embed]}));
}

function renderDashboard() {
  var el=document.getElementById('admin-dashboard'); if(!el) return;
  var orders=S.orders;
  var today=todayStr();
  var pending=orders.filter(function(o){return o.status==='new';});
  var inProgress=orders.filter(function(o){return o.status==='progress';});
  var todayDel=orders.filter(function(o){return o.deliveryDate===today&&o.status!=='annule';});
  var totalRevenue=orders.filter(function(o){return o.status==='livree';}).reduce(function(s,o){return s+o.total*(1-((o.discount||0)/100));},0);
  var statCards=[
    {icon:'📋',label:'En attente',val:pending.length},
    {icon:'🛠️',label:'En preparation',val:inProgress.length},
    {icon:'📅',label:"Livraisons aujourd'hui",val:todayDel.length},
    {icon:'💰',label:'CA total livre',val:fmtP(totalRevenue)}
  ].map(function(s){
    return '<div class="panel" style="text-align:center;padding:1.25rem">'
      +'<div style="font-size:1.8rem;margin-bottom:.4rem">'+s.icon+'</div>'
      +'<div style="font-family:\'Rye\',serif;font-size:1.4rem;color:var(--or)">'+s.val+'</div>'
      +'<div class="text-xs text-muted" style="margin-top:.3rem;letter-spacing:.5px">'+s.label+'</div>'
      +'</div>';
  }).join('');
  var stCls={new:'badge-new',progress:'badge-progress',done:'badge-done',livree:'badge-done',annule:'badge-annule'};
  var todayRows=todayDel.length?todayDel.map(function(o){
    return '<tr><td style="font-family:\'Rye\',serif;color:var(--or);font-size:.85rem">'+h(o.id)+'</td>'
      +'<td>'+h(o.company)+'</td><td>'+h(o.slot)+'</td>'
      +'<td>'+(o.livreurName?'<span class="text-xs text-gold">'+h(o.livreurName)+'</span>':'<span class="text-xs text-muted">—</span>')+'</td>'
      +'<td><span class="badge '+(stCls[o.status]||'')+'">'+h(o.status)+'</span></td></tr>';
  }).join(''):'<tr><td colspan="5" class="text-muted" style="text-align:center;padding:1rem">Aucune livraison prevue</td></tr>';
  var coStats={};
  orders.forEach(function(o){
    if(!coStats[o.company]) coStats[o.company]={total:0,active:0};
    coStats[o.company].total++;
    if(o.status!=='livree'&&o.status!=='annule') coStats[o.company].active++;

// ============================================================
function saveOrderQty(id) {
  var o=S.orders.find(function(o){return o.id===id;}); if(!o) return;
  var co=getCo(null,o.company);
  var prods=(co&&co.catalog&&co.catalog.length)?co.catalog.map(getP).filter(Boolean):S.products;
  var prevItems=JSON.parse(JSON.stringify(o.items||[]));
  var newItems=[];
  prods.forEach(function(p){
    var inp=document.getElementById('eq-qty-'+p.id);
    var qty=inp?parseInt(inp.value)||0:0;
    if(qty>0) newItems.push({pid:p.id,qty:qty});
  });
  if(!newItems.length){showToast('Ajoutez au moins un produit');return;}
  o.items=newItems;
  // Recalculate total
  var newTotal=newItems.reduce(function(s,i){var p=getP(i.pid);return p?s+(co?getPrice(i.pid,co):p.price)*i.qty:s;},0);
  o.total=newTotal;
  // Build change text
  var lines=[];
  newItems.forEach(function(ni){
    var p=getP(ni.pid); if(!p) return;
    var prev=prevItems.find(function(i){return i.pid===ni.pid;});
    var prevQty=prev?prev.qty:0;
    if(prevQty!==ni.qty) lines.push(p.emoji+' '+p.name+' : '+prevQty+' -> '+ni.qty+' '+p.unit);
  });
  prevItems.forEach(function(pi){
    if(!newItems.find(function(ni){return ni.pid===pi.pid;})){
      var p=getP(pi.pid); if(p) lines.push(p.emoji+' '+p.name+' : '+pi.qty+' -> 0 (retire)');
    }
  });
  var changesTxt=lines.length?lines.join('\n'):'Aucune modification';
  addActivityLog('Quantites '+id+' modifiees');
  discordOrderEdit(o,changesTxt);
  discordNotifyEntreprise(o,'edit',changesTxt);
  addNotif('admin','Quantites modifiees — '+id,changesTxt,'📦');
  addNotif('partner','Votre commande '+id+' a ete mise a jour',changesTxt,'📦');
  closeModal(); saveNow(); renderOrders();
  showToast('Quantites enregistrees');
}

var DRAFT_KEY   = 'ss_draft_v1';

// ============================================================
// BROUILLON COMMANDE — localStorage (par entreprise)
// ============================================================
function _draftKey(login) { return DRAFT_KEY + '_' + login; }

function _saveDraft(login) {
  try {
    if(!login) return;
    var draft = {
      cart: S.cart,
      orderForm: S.orderForm,
      section: S.partnerSection || 'catalog',
      ts: Date.now()
    };
    localStorage.setItem(_draftKey(login), JSON.stringify(draft));
    // Aussi sauvegarder cote GAS pour acces multi-appareils
    _pushDraftToGAS(login, draft);
  } catch(e) {}
}

function _loadDraft(login) {
  try {
    if(!login) return null;
    var raw = localStorage.getItem(_draftKey(login));
    if(!raw) return null;
    var draft = JSON.parse(raw);
    // Brouillon valide 24h
    if(!draft || (Date.now() - draft.ts) > 24*3600*1000) {
      localStorage.removeItem(_draftKey(login));
      return null;
    }
    return draft;
  } catch(e) { return null; }
}

function _clearDraft(login) {
  try {
    if(!login) return;
    localStorage.removeItem(_draftKey(login));
    _clearDraftGAS(login);
  } catch(e) {}
}

function _pushDraftToGAS(login, draft) {
  ltdFetch('ent_save_draft',{login:login,draft:draft}).catch(function(){});
}

function _clearDraftGAS(login) {
  ltdFetch('ent_clear_draft',{login:login}).catch(function(){});
}

function _loadDraftFromGAS(login, cb) {
  ltdFetch('ent_get_draft',{login:login}).then(function(r){cb(r.draft||null);}).catch(function(){cb(null);});
}

function initApp() {
  // NE PAS effacer la session ici — utilisée pour l'auto-login
  ltdFetch('ent_get_data').then(function(res) {
    if(res && res.data) { applyStateData(res.data); }
    return Promise.all([
      ltdFetch('get_products_entreprise').catch(function(){ return null; }),
      ltdFetch('get_companies').catch(function(){ return null; })
    ]);
  }).then(function(results) {
    if(results) {
      var prodRes = results[0], coRes = results[1];
      if(prodRes && prodRes.success && prodRes.products && prodRes.products.length) {
        S.products = prodRes.products.map(function(p){
          return {id:p.id, name:p.name||p.nom||'', price:parseFloat(p.price||p.prix)||0,
            unit:p.unit||p.unite||'Unite', emoji:p.emoji||'📦', rupture:!!p.rupture};
        });
      }
      if(coRes && coRes.success && coRes.companies && coRes.companies.length) {
        S.companies = mergeCompanyDefaults(coRes.companies);
      }
    }
    initApp_orig();
  }).catch(function() {
    initApp_orig();
  });
}
function initApp_orig() {
  // Guard: don't run twice
  if(window._appInited) return;
  window._appInited = true;
  if(window._entLoggedIn) return; // déjà connecté

  loadState();
  // Forcer la déconnexion — jamais d'auto-login
  S.user = null; S.userType = null;
  // Nettoyer les anciennes clés de session qui pourraient exister
  try { localStorage.removeItem('ss_session_v1'); localStorage.removeItem('ss_session_v2'); localStorage.removeItem('ss_ent_session'); localStorage.removeItem('ss_session'); } catch(e) {}
  // Ne reset l'UI que si personne n'est déjà connecté
  if(!S.user) {
    document.getElementById('app-admin').style.display='none';
    document.getElementById('app-partner').style.display='none';
    var _lpi=document.getElementById('login-page');
    if(_lpi){_lpi.style.display='flex';_lpi.style.visibility='visible';_lpi.style.pointerEvents='auto';}
  }
  // _tryAutoLogin est désactivé - ne pas appeler

  var btnLogin = document.getElementById('btn-login-main');
  if(btnLogin) btnLogin.addEventListener('click', doLogin);

  var anavMap = {
    'anav-dashboard':'dashboard','anav-orders':'orders','anav-products':'products','anav-companies':'companies',
    'anav-catalogues':'catalogues','anav-livreurs':'livreurs','anav-profil':'profil'
  };
  for(var _navId in anavMap) {
    if(anavMap.hasOwnProperty(_navId)) {
      var _el = document.getElementById(_navId);
      if(_el) _el.addEventListener('click', (function(sec){ return function(){ showAdminSection(sec); }; })(anavMap[_navId]));
    }
  }

  document.querySelectorAll('.btn-logout-all').forEach(function(b) {
    b.addEventListener('click', logout);
  });

  var pnavs = [
    ['pnav-catalog','catalog'],['pnav-history','history'],['pnav-annuaire','annuaire'],['pnav-favoris','favoris']
  ];
  pnavs.forEach(function(pair) {
    var el = document.getElementById(pair[0]);
    if(el) el.addEventListener('click', (function(sec){ return function(){ goNav(sec, this); }; })(pair[1]));
  });
}

// Run immediately if DOM already ready (GAS case), otherwise wait
if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp_orig();
}

/* ═══ QTY DIRECT HANDLERS ═══ */

function qtyChange(e, pid, increment) {
  if(e){e.preventDefault();e.stopPropagation();}
  pid = String(pid);
  if(increment) {
    S.cart[pid] = (S.cart[pid]||0) + 1;
  } else {
    if((S.cart[pid]||0) > 0){ S.cart[pid]--; if(!S.cart[pid]) delete S.cart[pid]; }
  }
  var el=document.getElementById('qty-'+pid); if(el) el.value=S.cart[pid]||0;
  if(typeof updateCartBar==='function') updateCartBar();
  if(typeof _updateCartBar==='function') _updateCartBar();
}

function qtyMinus(e, pid) {
  if(e){e.preventDefault();e.stopPropagation();}
  pid = parseInt(pid);
  if((S.cart[pid]||0) > 0) { S.cart[pid]--; if(!S.cart[pid]) delete S.cart[pid]; }
  var el=document.getElementById('qty-'+pid); if(el) el.value=S.cart[pid]||0;
  if(typeof updateCartBar==='function') updateCartBar();
  if(typeof _updateCartBar==='function') _updateCartBar();
}
function qtyPlus(e, pid) {
  if(e){e.preventDefault();e.stopPropagation();}
  pid = parseInt(pid);
  S.cart[pid] = (S.cart[pid]||0) + 1;
  var el=document.getElementById('qty-'+pid); if(el) el.value=S.cart[pid];
  if(typeof updateCartBar==='function') updateCartBar();
  if(typeof _updateCartBar==='function') _updateCartBar();
}
function qtyInput(e, pid) {
  if(e) e.stopPropagation();
  pid = String(pid);
  var el=document.getElementById('qty-'+pid); if(!el) return;
  var val=Math.max(0,parseInt(el.value)||0); el.value=val;
  if(val>0) S.cart[pid]=val; else delete S.cart[pid];
  if(typeof updateCartBar==='function') updateCartBar();
  if(typeof _updateCartBar==='function') _updateCartBar();
}
</script>
